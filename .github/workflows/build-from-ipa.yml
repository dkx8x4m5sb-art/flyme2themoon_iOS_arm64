name: Build from IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 存放两个 ipa 的 Release tag
        default: assets

permissions:
  contents: write

jobs:
  build:
    # 仓库公开后 macos-14（arm64）也能用；arm64 runner 只对 public 仓库/付费计划开放
    runs-on: macos-15
    env:
      TAG: ${{ inputs.release_tag || 'assets' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # 网页上传的往往是一个 zip，这里先解开（真逻辑在 ci/pipeline.sh）
      - name: Unpack project
        run: |
          shopt -s nullglob
          for z in *.zip; do echo "解压 $z"; unzip -q -o "$z" -d .; done
          ls -la | head -20

      - name: Pipeline
        run: bash ci/pipeline.sh

      - name: Upload IPA
        if: always() && hashFiles('FlyMe2theMoon-unsigned.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FlyMe2theMoon-unsigned
          path: FlyMe2theMoon-unsigned.ipa
