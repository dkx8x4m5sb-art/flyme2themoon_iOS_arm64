name: Build from IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # 全部逻辑在 ci/pipeline.sh（在仓库的 zip 里），改逻辑只要换 zip，不用改这个文件
      - name: Pipeline
        run: bash ci/pipeline.sh

      - name: Upload IPA
        if: always() && hashFiles('FlyMe2theMoon-unsigned.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FlyMe2theMoon-unsigned
          path: FlyMe2theMoon-unsigned.ipa
