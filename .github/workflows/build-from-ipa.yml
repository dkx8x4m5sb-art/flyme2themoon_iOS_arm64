name: Build from IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # 先用仓库里的 zip（源码包 / 素材包）铺好工作区
      - name: Unpack zips
        run: |
          shopt -s nullglob
          for z in *.zip; do echo "unzip $z"; unzip -q -o "$z" -d .; done
          ls -la | head -20

      # 真逻辑在 ci/pipeline.sh（在源码 zip 里）
      - name: Pipeline
        run: bash ci/pipeline.sh

      - name: Upload IPA
        if: always() && hashFiles('FlyMe2theMoon-unsigned.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FlyMe2theMoon-unsigned
          path: FlyMe2theMoon-unsigned.ipa
